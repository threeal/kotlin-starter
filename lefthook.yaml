pre-commit:
  piped: true
  fail_on_changes: always
  fail_on_changes_diff: true
  jobs:
    - name: check types
      run: ./gradlew testClasses

    - name: check lint
      run: ./gradlew detekt

    - name: fix kotlin formatting
      run: ./gradlew ktfmtFormat

    - name: fix formatting
      run: dprint fmt
